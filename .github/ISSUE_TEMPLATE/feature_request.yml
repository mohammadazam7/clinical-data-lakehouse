name: Feature request
description: Propose a mapping, measure, check or warehouse target
labels: [enhancement]
body:
  - type: textarea
    id: question
    attributes:
      label: Problem
      description: What you were trying to do with your OMOP data and where the pipeline fell short.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: How it would work, and how a test or the data quality report would show it is right.
    validations:
      required: true
