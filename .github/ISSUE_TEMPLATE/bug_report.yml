name: Bug report
description: A pipeline step, model or analysis produced wrong results or failed
labels: [bug]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [Synthea generation, FHIR ingestion, de-identification, OMOP models, vocabulary mapping, data quality, measures, CLI, web app]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and environment
      description: The exact command, Python version, Synthea seed and population size. Never paste real patient data.
      render: shell
