version: 2

seeds:
  - name: demographic_concepts
    description: >
      OMOP standard concepts for the administrative gender and the OMB race and ethnicity
      categories that FHIR US Core patients carry. Nine rows, kept here because person
      cannot be built without them; clinical vocabularies (SNOMED, LOINC, RxNorm) are
      never committed and come from the pinned concept subset instead.
    config:
      column_types:
        source_code: varchar
        concept_id: integer
    columns:
      - name: concept_id
        data_tests: [not_null, unique]
  - name: visit_concepts
    description: >
      OMOP visit concepts for the HL7 encounter classes Synthea writes. Classes without a
      row here (home health, virtual) map to concept 0 until the pinned concept subset
      is wired in and they can be checked against it.
    config:
      column_types:
        class_code: varchar
        concept_id: integer
    columns:
      - name: class_code
        data_tests: [not_null, unique]
